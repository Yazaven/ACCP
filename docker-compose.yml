version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:password@db:5432/complaints
      - JWT_SECRET_KEY=change-me-in-production
      - FRONTEND_URL=http://localhost:5173
      # Optional — AI features require a Gemini key:
      # - GEMINI_API_KEY=your-key-here
      # Optional — email features require Brevo:
      # - BREVO_API_KEY=your-key-here
      # - SENDER_EMAIL=noreply@yourdomain.com
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-demo-client-id}
    ports:
      - "5173:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: complaints
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
